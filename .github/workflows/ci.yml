name: CI

on:
  push:
    branches: [main, modernize/2026]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Test, lint, and build
        working-directory: android-app
        run: ./gradlew --no-daemon :core:test :app:lintDebug :app:assembleDebug :app:assembleRelease
      - name: Verify every declared test executed
        run: python3 scripts/generate_test_report.py
      - name: Verify database schema
        run: python3 scripts/verify_schema.py
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: android-app/core/build/test-results/test/
          retention-days: 14
