[versions]
agp = "9.5.2"
kotlin = "2.4.21"
coreKtx = "1.18.0"
appcompat = "1.8.0"
material = "1.14.0"
junit = "6.1.3"
kotest = "6.2.7"
bouncyCastle = "1.87"
commonsLang = "3.22.0"
guava = "33.8.0-jre"
httpClient = "4.5.14"
jdom = "2.0.6.1"
jose4j = "0.9.7"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
kotest-property = { group = "io.kotest", name = "kotest-property", version.ref = "kotest" }
tool-bcpkix = { group = "org.bouncycastle", name = "bcpkix-jdk18on", version.ref = "bouncyCastle" }
tool-bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncyCastle" }
tool-bcutil = { group = "org.bouncycastle", name = "bcutil-jdk18on", version.ref = "bouncyCastle" }
tool-commons-lang = { group = "org.apache.commons", name = "commons-lang3", version.ref = "commonsLang" }
tool-guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
tool-httpclient = { group = "org.apache.httpcomponents", name = "httpclient", version.ref = "httpClient" }
tool-jdom = { group = "org.jdom", name = "jdom2", version.ref = "jdom" }
tool-jose4j = { group = "org.bitbucket.b_c", name = "jose4j", version.ref = "jose4j" }

[bundles]
patched-build-tools = ["tool-bcpkix", "tool-bcprov", "tool-bcutil", "tool-commons-lang", "tool-guava", "tool-httpclient", "tool-jdom", "tool-jose4j"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
